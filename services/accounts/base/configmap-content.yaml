# services/accounts/base/configmap-content.yaml
# Static content served by httpd. Without an index.html the ubi9/httpd-24
# image answers / with the Apache welcome page and HTTP 403, which would
# fail the probes below and show the app Degraded in Argo CD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounts-content
  labels:
    app: accounts
data:
  index.html: |
    <html><body><h1>accounts</h1><p>gitops-webinar-demo service</p></body></html>
