# services/recommendations/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendations
  labels:
    app: recommendations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendations
  template:
    metadata:
      labels:
        app: recommendations
    spec:
      containers:
        - name: web
          # UBI httpd: unprivileged, listens on 8080, runs under restricted-v2,
          # no pull secret needed.
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: recommendations-env
          volumeMounts:
            # Serve index.html so / returns 200 (see configmap.yaml).
            - name: content
              mountPath: /var/www/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # Explicit so nothing trips SCC admission under restricted-v2.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # A green Argo CD app that is unhealthy underneath ruins the demo.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: content
          configMap:
            name: recommendations-content
