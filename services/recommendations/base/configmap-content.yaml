# services/recommendations/base/configmap-content.yaml
# Static content served by httpd. Without an index.html the ubi9/httpd-24
# image answers / with the Apache welcome page and HTTP 403, which would
# fail the probes below and show the app Degraded in Argo CD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendations-content
  labels:
    app: recommendations
data:
  index.html: |
    <html><body><h1>recommendations</h1><p>gitops-webinar-demo service</p></body></html>
