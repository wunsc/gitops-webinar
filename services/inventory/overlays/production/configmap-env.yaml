# services/inventory/overlays/production/configmap-env.yaml
# Environment configuration lives in the overlay (repo convention):
# the base describes the workload, the overlay describes this environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-env
  labels:
    app: inventory
data:
  SERVICE_NAME: "inventory"
  # DB_POOL_MAX is the value the revert demo (beat 4) changes and reverts.
  # It lives here, not in the Deployment, so the git diff stays one line.
  DB_POOL_MAX: "20"
  LOG_LEVEL: "info"
